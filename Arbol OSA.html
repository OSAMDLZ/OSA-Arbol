<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!--
  =====================================================================
  GUÍA GENERAL DEL ARCHIVO  (OSA Matrix · Reportes)
  =====================================================================
  Es UN SOLO archivo HTML con tres bloques:
    1) <style>  → todo el diseño (colores, tamaños, fondos, animaciones).
    2) HTML     → la estructura visible, de arriba a abajo:
         .hero     Portada negra lisa: cabecera + título + cifras + eslogan
         .lower    Fondo azul noche: sección "Áreas" (ruta + árbol de decisión)
         .repband  Banda morada: sección "Reportes" (listado con búsqueda/filtros)
         .footband Pie negro: lema a la izquierda y la X (bg.jpg) a la derecha
    3) <script> → la lógica: datos de los reportes, árbol interactivo,
                  líneas conectoras animadas y listado con filtros.

  CAMBIOS FRECUENTES (dónde tocar):
    • Agregar/quitar/renombrar un reporte ........ lista ROWS (en <script>)
    • Poner el enlace de Power BI de un reporte .. objeto URLS (en <script>); sin enlace el reporte no hace nada
    • Los reportes abren en la misma pestaña (ver comentario en "ENLACES POWER BI")
    • Cambiar colores de marca ................... variables :root (en <style>)
    • Cambiar el fondo de la banda de Reportes ... CSS ".repband" (al final del <style>)
    • Cambiar textos fijos (títulos, descripciones) . en el HTML, busque el texto
  Imágenes externas que deben estar junto a este archivo:
    bg.jpg (cintas/X del pie), logo.png (OSA Matrix), slogan.png (eslogan).
  =====================================================================
-->
<title>Árbol de reportes OSA Matrix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Anton&display=swap">
<style>
/* Layout: página negra con las cintas azul y naranja a la derecha (imagen de fondo), cabecera con el logo OSA Matrix junto a Mondelēz International, resumen de cifras, ruta de navegación y árbol de decisión horizontal con conectores animados */
:root {
  /* ----- VARIABLES DE COLOR (cámbielas aquí y se aplican en toda la página) ----- */
  --night: #000000;               /* negro base de la página */
  --navy: #004095;                /* azul oscuro de marca */
  --blue: #005BD8;                /* azul de marca */
  --sky: #3D8BFF;                 /* azul claro (color "Operativo" y detalles) */
  --orange: #F07800;              /* naranja: elementos seleccionados */
  --gold: #FEBF02;                /* dorado: acentos, números, hover */
  --silver: #DCDCDC;              /* gris plata para textos secundarios */
  --ink: #F5F7FB;                 /* color principal del texto */
  --muted: #9AA7BC;               /* texto atenuado (descripciones) */
  --line: rgba(220, 220, 220, .14); /* color de bordes y líneas finas */
  --panel: rgba(4, 8, 18, .8);    /* fondo semitransparente de las tarjetas */
  --ac: var(--sky);               /* acento de las columnas del árbol (JS lo cambia a naranja al elegir un área) */
  /* Tipografías: la de títulos se redefine como "Anton" en el bloque "Juntos somos imparables" */
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
/* ===== BASE: reglas generales de toda la página =====
   box-sizing: el padding y el borde cuentan dentro del ancho de cada elemento */
* { box-sizing: border-box; }
html { background: var(--night); }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
/* ".sr": texto solo para lectores de pantalla (invisible a la vista, accesibilidad) */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ".bg": imagen de fondo con las cintas azul y naranja (la X). Ahora vive SOLO en el pie (.footband). Para cambiarla, reemplace bg.jpg */
.bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; background: #000 url("bg.jpg") right center / cover no-repeat; }
/* Deja cabecera y contenido por encima de las capas de fondo */
.top, .wrap { position: relative; z-index: 1; }

/* ===== CABECERA (.top): barra superior con marca Mondelēz + logo OSA Matrix + lema ===== */
.top { background: rgba(0, 0, 0, .6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
/* Contenedor interno de la cabecera: centrado, máx. 1320px, en fila y con salto de línea en pantallas pequeñas */
.top-in {
  max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 12px max(16px, env(safe-area-inset-left, 0px)) 12px max(16px, env(safe-area-inset-right, 0px));
}
/* Texto "Mondelēz International" (el "small" es la línea de abajo en mayúsculas) */
.brand { font-weight: 600; font-size: 18px; letter-spacing: .01em; color: #fff; line-height: 1.15; }
.brand small { display: block; font-weight: 500; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--silver); opacity: .8; }
/* Línea vertical que separa Mondelēz del logo OSA Matrix */
.sep { width: 1px; height: 40px; background: rgba(255,255,255,.28); }
.logo { display: block; height: 46px; width: auto; max-width: 100%; }
.tag { margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--silver); opacity: .75; }
/* Cinta de colores de la marca. Se usa en la portada y arriba de la banda de Reportes. Ajuste los % para cambiar el ancho de cada color */
.stripe { height: 3px; background: linear-gradient(90deg, var(--navy) 0 50%, var(--blue) 50% 72%, var(--purple) 72% 80%, var(--orange) 80% 92%, var(--gold) 92% 100%); }

/* ===== CONTENEDOR PRINCIPAL (.wrap): centra el contenido de la sección "Áreas" y apila sus bloques con 18px de separación ===== */
.wrap {
  max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;
  padding-block: 28px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ===== INTRODUCCIÓN (portada): eyebrow + título + párrafo a la izquierda, cifras abajo, eslogan a la derecha ===== */
.intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px 40px; flex-wrap: wrap; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--orange); margin: 0 0 8px; }
.intro h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; letter-spacing: -.01em; margin: 0 0 8px; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); max-width: 60ch; }
/* ".kpis" / ".kpi": las 3 cifras de resumen (Reportes, Áreas, Subprocesos), generadas por JS en "Cifras de resumen" */
.kpis { display: flex; flex-wrap: wrap; row-gap: 12px; }
.kpi { padding: 0 24px; border-left: 1px solid var(--line); }
.kpi:first-child { padding-left: 0; border-left: 0; }
.kpi:last-child { padding-right: 0; }
.kpi b { display: block; font-family: var(--font-display); font-weight: 500; font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi span { display: block; margin-top: 4px; font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

/* ===== RUTA (migas de pan): muestra "Área › Subproceso" y el botón Reiniciar. La genera JS en crumbsHTML() ===== */
.crumbs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-height: 36px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 0; }
.crumbs .lbl { font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-right: 8px; }
.crumbs .empty { color: var(--muted); }
.crumbs .chev { color: var(--muted); padding: 0 2px; }
.crumb { background: none; border: 0; font-weight: 600; cursor: pointer; padding: 5px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.crumb i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.crumb:hover { background: rgba(255,255,255,.08); }
.crumb.current { cursor: default; color: #fff; }
.crumb.current:hover { background: none; }
.reset { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--ink); font-weight: 600; cursor: pointer; padding: 4px 14px; border-radius: 6px; font-size: 12px; }
.reset:hover { border-color: var(--gold); color: var(--gold); }

/* ===== ÁRBOL HORIZONTAL (el gráfico de arriba) =====
   .tree-card   = tarjeta contenedora (borde redondeado, brillo azul a la izquierda)
   .tree-scroll = permite deslizar de lado en pantallas pequeñas
   .tree        = cuadrícula de 4 columnas: Total › Área › Subproceso › Reporte
   .links       = capa SVG donde JS dibuja las líneas conectoras
   .col         = una columna; ".locked" la oculta hasta elegir el paso anterior
   .colhead     = encabezado de columna (título + pregunta/valor elegido + botón ×)
   .nodes       = lista de elementos de la columna */
.tree-card {
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  background: radial-gradient(520px 340px at 0% 50%, rgba(0, 64, 149, .32), transparent 72%), var(--panel);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.tree-scroll { overflow-x: auto; overflow-y: hidden; padding: 22px 24px 28px; scrollbar-width: thin; scrollbar-color: rgba(61,139,255,.5) transparent; }
.tree {
  position: relative; display: grid; grid-template-columns: repeat(4, minmax(200px, 1fr));
  column-gap: clamp(36px, 4vw, 64px); min-width: 940px; min-height: 540px;
}
.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 0; }
.col { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; transition: opacity .5s ease; }
.col.locked { opacity: 0; visibility: hidden; pointer-events: none; }

.colhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; border-bottom: 2px solid var(--ac); padding-bottom: 7px; min-height: 58px; transition: border-color .4s; }
.colhead.blank { border-bottom-color: transparent; }
.colhead b { display: block; font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
.colhead .val { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); font-weight: 500; overflow-wrap: anywhere; }
.colhead .q { display: block; margin-top: 2px; font-size: 13px; color: var(--gold); font-weight: 500; animation: ask 2.4s ease-in-out infinite; }
.colhead .x { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; padding: 0 6px; border-radius: 6px; }
.colhead .x:hover { color: #fff; background: rgba(255,255,255,.1); }
@keyframes ask { 50% { opacity: .6; } }

.nodes { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; }

/* ".node" = fila de Área/Subproceso (botón con barra, nombre y cantidad); ".report" = tarjeta de reporte con enlace */
.node, .report {
  --c: #3D8BFF;
  position: relative; display: block; width: 100%; text-align: left; text-decoration: none; color: var(--ink);
  background: transparent; border: 0; border-radius: 8px; padding: 9px 10px 10px; cursor: pointer;
  transform-origin: left center; transition: background .2s, opacity .25s;
}
.node:hover, .report:hover { background: rgba(255,255,255,.06); }
/* ".bar": barra proporcional (JS calcula su ancho según la cantidad de reportes) */
.bar { display: block; height: 6px; border-radius: 2px; background: rgba(220,220,220,.14); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--c); transition: width .6s; }
.name { display: block; margin-top: 7px; font-size: 13px; font-weight: 500; line-height: 1.35; color: color-mix(in srgb, var(--ink) 86%, transparent); overflow-wrap: anywhere; }
.count { display: block; font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.node:hover .name, .report:hover .name { color: #fff; }
/* Estado "seleccionado" (naranja) y atenuado de los no elegidos */
.node.sel { background: color-mix(in srgb, var(--c) 13%, transparent); }
.node.sel .name { color: #fff; font-weight: 600; }
.node.sel .count { color: var(--ink); }
.node.sel .bar { box-shadow: 0 0 10px color-mix(in srgb, var(--c) 55%, transparent); }
.nodes.has-sel .node:not(.sel) { opacity: .5; }
.nodes.has-sel .node:not(.sel):hover { opacity: 1; }
/* Nodo raíz "Total reportes": no es clicable */
.node.root { --c: #3D8BFF; cursor: default; }
.node.root:hover { background: transparent; }
.node.root .name { color: #fff; font-weight: 600; }

/* Tarjeta de reporte final: borde fino y flecha circular que se rellena al pasar el mouse */
.report { box-shadow: inset 0 0 0 1px var(--line); background: rgba(255,255,255,.04); transition: background .2s, box-shadow .2s, transform .2s; }
.report .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.report .name { color: #fff; font-weight: 600; }
.report .count { color: var(--gold); }
.report .go { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--c); color: var(--c); transition: background .2s, color .2s; }
.report:hover .go { background: var(--c); color: #000; }
.report .go svg { width: 14px; height: 14px; }
.report:hover { box-shadow: inset 0 0 0 1px var(--c); transform: translateY(-1px); }

.ping .bar i { animation: ping .9s ease-out; }
@keyframes ping { 0% { filter: brightness(1.8) drop-shadow(0 0 8px var(--c)); } 100% { filter: none; } }

/* ===== LÍNEAS CONECTORAS (SVG dibujado por drawLinks()) =====
   .lk = línea gris normal; .lk.on = línea del camino elegido (color + brillo); .flow = puntitos animados que viajan por el camino elegido */
.lk { fill: none; stroke: rgba(220,220,220,.2); stroke-width: 1.3; }
.lk.on { stroke-width: 2.2; stroke-linecap: round; filter: drop-shadow(0 0 3px currentColor); }
.flow { fill: none; stroke: var(--silver); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 1 20; opacity: .7; animation: dash 1.6s linear infinite, show .4s ease .9s backwards; }
@keyframes dash { to { stroke-dashoffset: -21; } }
@keyframes show { from { opacity: 0; } }

/* ===== ENCABEZADO DE SECCIÓN "Áreas": título y descripción ===== */
.sec { display: flex; flex-direction: column; gap: 14px; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 28px; flex-wrap: wrap; }
.sec-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 28px; line-height: 1.1; margin: 0; }
.sec-head p { margin: 4px 0 0; color: var(--muted); }

/* ===== SECCIÓN REPORTES (componentes) =====
   .rtoggle = botón-banner "REPORTES 42" que abre/cierra el panel
   .rpanel  = panel desplegable con buscador, filtros y listado
   .rcard   = tarjeta de cada reporte; .ptag = etiqueta de color del tipo
   (Los colores de esta sección se sobrescriben al final, en ".repband") */
.rtoggle {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left; cursor: pointer;
  padding: 18px 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: border-color .2s, background .2s;
}
.rtoggle:hover { border-color: rgba(61, 139, 255, .65); background: rgba(8, 16, 34, .85); }
.rt-text { min-width: 0; }
.rt-title { display: block; font-family: var(--font-display); font-weight: 500; font-size: 28px; line-height: 1.1; }
.rt-desc { display: block; margin-top: 4px; color: var(--muted); }
.rt-meta { display: flex; align-items: center; gap: 14px; flex: none; }
.rt-n { font-family: var(--font-display); font-weight: 500; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.rt-chev { transition: transform .25s; color: var(--muted); }
.rtoggle[aria-expanded="true"] .rt-chev { transform: rotate(180deg); }

/* Panel desplegable. El atributo [hidden] lo oculta hasta pulsar el botón */
.rpanel {
  border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px 26px; display: flex; flex-direction: column; gap: 16px;
  background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.rtools { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
/* Caja de búsqueda y chips de filtro por área (Todos / Sales / Demand / ...; los chips los genera JS) */
.search {
  flex: 1 1 260px; min-width: 0; max-width: 380px; padding: 9px 12px; font: inherit; color: var(--ink);
  background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 8px;
}
.search::placeholder { color: var(--muted); }
.rfilters { display: flex; gap: 8px; flex-wrap: wrap; }
.fchip {
  --c: var(--silver); cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 12px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; color: var(--silver);
}
.fchip i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.fchip:hover { border-color: var(--c); }
.fchip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); color: #fff; }
.rcount { font-size: 12px; color: var(--muted); }

/* Grupos por área en el listado (SALES, CS&L, Demand...). ".rgrid" = cuadrícula de tarjetas, se adapta sola al ancho */
.rgroup + .rgroup { margin-top: 22px; }
.rgroup h3 {
  display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
  font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--ink);
}
.rgroup h3 em { font-style: normal; color: var(--muted); font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 10px; }
.rcard {
  min-width: 0; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit;
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: rgba(255,255,255,.04);
  transition: border-color .2s, background .2s, transform .2s;
}
.rcard:hover { border-color: var(--silver); background: rgba(255,255,255,.08); transform: translateY(-1px); }
.rtop { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.rtop b { font-weight: 600; color: #fff; overflow-wrap: anywhere; }
.rtop svg { flex: none; width: 15px; height: 15px; margin-top: 3px; color: var(--muted); }
.rcard:hover .rtop svg { color: #fff; }
.rsub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.ptags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.ptag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; color: #fff; background: color-mix(in srgb, var(--c) 20%, transparent); }
.ptag i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.rempty { color: var(--muted); padding: 8px 0; }

/* Aviso "Deslice hacia la derecha": solo se ve en pantallas pequeñas (ver @media) */
.swipe { display: none; text-align: center; font-size: 12px; color: var(--muted); }
/* Texto del pie ("Juntos somos imparables / Mondelēz International"); su banda se define más abajo en ".footband" */
.foot { text-align: center; font-size: 10px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }

/* ===== RESPONSIVE: ajustes por tamaño de pantalla (tablet ≤1060px, móvil ≤700px y ≤560px) ===== */
@media (max-width: 1060px) {
  .tag { display: none; }
  .swipe { display: block; }
  .tree-scroll { padding: 16px 16px 22px; }
}
@media (max-width: 700px) {
  .bg { opacity: .55; }
  .logo { height: 38px; }
  .sep { height: 34px; }
}
@media (max-width: 560px) {
  .kpi { padding: 0 16px; }
  .kpi b { font-size: 30px; }
}
/* Accesibilidad: si el usuario desactiva animaciones en su sistema, se apagan todas */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ===== ESTILO "JUNTOS SOMOS IMPARABLES" =====
   Este bloque SOBRESCRIBE reglas anteriores (la última regla gana): fuente Anton para títulos, degradado dorado con sombra roja en títulos y cifras, y animación del eslogan.
   Para cambiar la fuente de los títulos, edite --font-display aquí.
   Juntos somos imparables: dorado/naranja con sombra roja y negra, y púrpura de los fragmentos */
:root { --purple: #A07CE6; --red: #E8262A; --grad: linear-gradient(180deg, #FFD23F 0%, #FEBF02 42%, #F07800 100%); --font-display: "Anton", Impact, "Arial Narrow", sans-serif; }
.intro { align-items: center; }
.intro-main { flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.intro h1, .sec-head h2, .rt-title { text-transform: uppercase; letter-spacing: .03em; font-weight: 400; }
.intro h1 { font-size: clamp(30px, 4.6vw, 50px); line-height: 1.05; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(2px 2px 0 var(--red)) drop-shadow(3px 3px 0 #000); }
.sec-head h2, .rt-title { font-size: 30px; }

    if (!a) { a = { id: slug(r[0]), name: r[0], count: 0, subs: [], bySub: {} }; by[r[0]] = a; list.push(a); }
    var s = a.bySub[r[1]];
    if (!s) { s = { name: r[1], reports: [] }; a.bySub[r[1]] = s; a.subs.push(s); }
    s.reports.push({ name: r[3], url: URLS[r[3]] || "", legend: r[2].split("").map(function (c) { return PCODE[c]; }) });
    a.count++;
  });
  list.forEach(function (a) { a.subs.sort(function (x, y) { return y.reports.length - x.reports.length; }); });
  list.sort(function (x, y) { return y.count - x.count; });
  return list;
})();

/* ============ ESTADO ============
   sel = lo que el usuario eligió (área, subproceso); al cambiarlo se llama a render().
   BASE/ORANGE/NEUTRAL = colores de nodos | COLS = columnas del árbol | reduce = el usuario pidió menos animación */
var BASE = "#3D8BFF", ORANGE = "#F07800", NEUTRAL = "#9DB4D6";
var COLS = ["root", "area", "sub", "report"];
var sel = { area: null, proc: null, sub: null };
var linkSeen = {};
var kb = false;
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var NS = "http://www.w3.org/2000/svg";
var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>';

/* Utilidades: getArea/getSub devuelven el área/subproceso elegido; esc() protege el HTML de caracteres especiales; maxOf() da el mayor valor (escala de las barras) */
function getArea() { return AREAS.find(function (a) { return a.id === sel.area; }) || null; }
function getSub() { var a = getArea(); return a ? a.subs.find(function (s) { return s.name === sel.sub; }) || null : null; }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function maxOf(arr) { return Math.max.apply(null, arr.concat([1])); }

/* ============ ESTRUCTURA ============
   Crea las 4 columnas del árbol (bloqueadas al inicio) y la capa SVG de líneas */
var tree = document.getElementById("tree");
var scroller = document.getElementById("scroll");
tree.innerHTML = '<svg class="links" id="links" aria-hidden="true"></svg>' + COLS.map(function (k) {
  return '<div class="col locked" data-key="' + k + '"><div class="colhead"></div><div class="nodes"></div></div>';
}).join("");
var svg = document.getElementById("links");
function colEl(k) { return tree.querySelector('.col[data-key="' + k + '"]'); }

/* model(): describe qué muestra cada columna según la selección actual (títulos, preguntas, nodos). Para cambiar las preguntas ("¿De qué área es el reporte?", etc.) edite aquí */
function model() {
  var a = getArea(), s = getSub(), m = {};
  m.root = { open: true, blank: true, nodes: [{ kind: "root", key: "root", name: "Total reportes", count: ROWS.length, max: ROWS.length, color: BASE }] };

  var maxA = maxOf(AREAS.map(function (x) { return x.count; }));
  m.area = { open: true, label: "Área", q: "¿De qué área es el reporte?", val: a ? a.name : "", clear: !!a,
    nodes: AREAS.map(function (x) { var on = !!a && a.id === x.id; return { kind: "node", col: "area", id: x.id, key: "area:" + x.id, name: x.name, count: x.count, max: maxA, color: on ? ORANGE : NEUTRAL, selected: on }; }) };

  m.sub = { open: !!a, label: "Subproceso", q: "¿Cuál subproceso?", val: s ? s.name : "", clear: !!s, nodes: [] };
  if (a) {
    var maxS = maxOf(a.subs.map(function (x) { return x.reports.length; }));
    m.sub.nodes = a.subs.map(function (x) { var on = !!s && s.name === x.name; return { kind: "node", col: "sub", id: x.name, key: "sub:" + a.id + "/" + x.name, name: x.name, count: x.reports.length, max: maxS, color: on ? ORANGE : NEUTRAL, selected: on }; });
  }

  m.report = { open: !!s, label: "Reporte", q: "Elija uno para abrir su dashboard", val: "", clear: false, nodes: [] };
  if (s) {
    m.report.nodes = s.reports.map(function (r, i) { return { kind: "report", idx: i, key: "rep:" + a.id + "/" + s.name + "/" + r.name, name: r.name, url: r.url, legend: r.legend, color: PCOLOR[r.legend[0]] }; });
  }
  return m;
}

/* legGrad / legTags: color (o degradado de 2 colores) y etiquetas de tipo de un reporte */
function legGrad(l) { var c = l.map(function (x) { return PCOLOR[x]; }); return c.length > 1 ? "linear-gradient(90deg," + c[0] + " 50%," + c[1] + " 50%)" : c[0]; }
function legTags(l) { return l.map(function (x) { return '<span class="ptag" style="--c:' + PCOLOR[x] + '"><i></i>' + PROC[x] + "</span>"; }).join(""); }

/* nodeHTML(): arma el HTML de un nodo: raíz, área/subproceso (botón) o reporte (enlace a Power BI, misma pestaña; sin enlace queda inactivo con la clase "nolink") */
function nodeHTML(n) {
  var st = "--c:" + n.color;
  var pct = Math.max(7, Math.round((n.count || 0) / (n.max || 1) * 100));
  if (n.kind === "report") {
    return '<a class="report' + (n.url ? '' : ' nolink') + '" data-key="' + esc(n.key) + '" data-report="' + n.idx + '" style="' + st + '"' + (n.url ? ' href="' + esc(n.url) + '" target="_blank" rel="noopener"' : '') + '>' +
      '<span class="bar"><i style="width:100%;background:' + legGrad(n.legend) + '"></i></span><span class="row"><span><span class="name">' + esc(n.name) + '</span><span class="ptags">' + legTags(n.legend) + '</span></span><span class="go">' + ARROW + '</span></span></a>';
  }
  var inner = '<span class="bar"><i style="width:' + pct + '%"></i></span><span class="name">' + esc(n.name) + '</span><span class="count">' + n.count + '</span>';
  if (n.kind === "root") return '<div class="node root" data-key="root" style="' + st + '">' + inner + '</div>';
  return '<button class="node' + (n.selected ? " sel" : "") + '" data-col="' + n.col + '" data-id="' + esc(n.id) + '" data-key="' + esc(n.key) + '" style="' + st + '" aria-pressed="' + !!n.selected + '">' + inner + '</button>';
}

/* crumbsHTML(): arma la ruta "Área › Subproceso" y el botón Reiniciar */
function crumbsHTML(a, s) {
  var h = '<span class="lbl">Ruta</span>';
  if (!a) return h + '<span class="empty">Seleccione un área para comenzar</span>';
  var parts = [{ t: a.name, go: "sub", cur: !s }, s ? { t: s.name, go: "", cur: true } : null].filter(Boolean);
  h += parts.map(function (x, i) {
    return (i ? '<span class="chev">›</span>' : "") +
      (x.cur ? '<span class="crumb current" style="--c:' + ORANGE + '"><i></i>' + esc(x.t) + "</span>"
             : '<button class="crumb" style="--c:' + ORANGE + '" data-clear="' + x.go + '"><i></i>' + esc(x.t) + "</button>");
  }).join("");
  return h + '<button class="reset" id="reset">Reiniciar</button>';
}

/* render(): repinta TODO el árbol según "sel" (columnas, encabezados, nodos, ruta) y redibuja las líneas. Se llama en cada clic */
function render(focusCol) {
  var m = model();
  var a = getArea(), s = getSub();
  tree.style.setProperty("--ac", a ? ORANGE : BASE);

  COLS.forEach(function (k) {
    var c = m[k], el = colEl(k);
    el.classList.toggle("locked", !c.open);
    var head = el.querySelector(".colhead");
    head.classList.toggle("blank", !!c.blank);
    var h = "";
    if (c.open && !c.blank) {
      h = "<div><b>" + c.label + "</b>" + (c.val ? '<span class="val">' + esc(c.val) + "</span>" : '<span class="q">' + c.q + "</span>") + "</div>" +
        (c.clear ? '<button class="x" data-clear="' + k + '" aria-label="Quitar ' + c.label + '">×</button>' : "");
    }
    head.innerHTML = h;
    var nodes = el.querySelector(".nodes");
    nodes.classList.toggle("has-sel", !!c.val);
    nodes.innerHTML = c.open ? c.nodes.map(nodeHTML).join("") : "";
  });

  document.getElementById("sr").textContent = !a ? m.area.q : !s ? m.sub.q : "Reportes disponibles: " + s.reports.length;

  requestAnimationFrame(function () { drawLinks(true); });
  if (focusCol) setTimeout(function () { revealCol(focusCol); }, 140);
  if (kb && focusCol) {
    var f = colEl(focusCol).querySelector(".node:not(.root), .report");
    if (f) f.focus({ preventScroll: true });
  }
}

/* revealCol(): en pantallas pequeñas desplaza el árbol de lado para que la columna nueva quede a la vista */
function revealCol(k) {
  var el = colEl(k);
  if (!el || scroller.scrollWidth <= scroller.clientWidth + 2) return;
  var left = el.offsetLeft, right = left + el.offsetWidth, target = scroller.scrollLeft;
  if (right + 24 > scroller.scrollLeft + scroller.clientWidth) target = right + 24 - scroller.clientWidth;
  else if (left - 24 < scroller.scrollLeft) target = Math.max(0, left - 24);
  scroller.scrollTo({ left: target, behavior: reduce ? "auto" : "smooth" });
}

/* ============ CONECTORES, BROTES Y PULSOS ============
   Todo lo de abajo es SOLO efecto visual (curvas, pulsos dorados, aparición de nodos); si algo falla aquí, el árbol sigue funcionando.
   pos() = posición de un elemento en el árbol | mk() = crea elementos SVG | sendPulse()/tick() = pulso dorado que viaja por la línea | drawLinks() = dibuja las líneas */
function pos(el) {
  var x = 0, y = 0;
  while (el && el !== tree) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return { x: x, y: y };
}
function mk(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

var pulses = [], raf = 0;
function ping(el) { el.classList.remove("ping"); void el.offsetWidth; el.classList.add("ping"); }
function sendPulse(path, len, delay, dur, target) {
  var g = mk("g", { opacity: 0 });
  g.appendChild(mk("circle", { r: 8, fill: "#FEBF02", "fill-opacity": .18 }));
  g.appendChild(mk("circle", { r: 3, fill: "#FEBF02" }));
  svg.appendChild(g);
  pulses.push({ path: path, len: len, t0: performance.now() + delay, dur: dur, g: g, target: target });
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(now) {
  pulses = pulses.filter(function (p) {
    if (!p.path.isConnected) { p.g.remove(); return false; }
    var t = (now - p.t0) / p.dur;
    if (t < 0) return true;
    if (t >= 1) { p.g.remove(); if (p.target && p.target.isConnected) ping(p.target); return false; }
    var e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    var pt = p.path.getPointAtLength(p.len * e);
    p.g.setAttribute("transform", "translate(" + pt.x + " " + pt.y + ")");
    p.g.setAttribute("opacity", 1);
    return true;
  });
  raf = pulses.length ? requestAnimationFrame(tick) : 0;
}

/* drawLinks(): une con curvas el nodo elegido de cada columna con todos los nodos de la columna siguiente; el camino elegido se resalta con color y puntos animados */
function drawLinks(animate) {
  svg.innerHTML = "";
  pulses = [];
  svg.setAttribute("viewBox", "0 0 " + tree.offsetWidth + " " + tree.offsetHeight);
  var area = getArea(), nextSeen = {};
  for (var i = 0; i < COLS.length - 1; i++) {
    var pc = colEl(COLS[i]), cc = colEl(COLS[i + 1]);
    if (cc.classList.contains("locked")) continue;
    var parent = i === 0 ? pc.querySelector(".node.root") : pc.querySelector(".node.sel");
    if (!parent) continue;
    var pb = parent.querySelector(".bar"), pp = pos(parent);
    var x1 = pp.x + pb.offsetLeft + pb.offsetWidth, y1 = pp.y + pb.offsetTop + pb.offsetHeight / 2;
    var kids = cc.querySelectorAll(".node, .report");
    var dots = [], idx = 0;
    kids.forEach(function (k) {
      var kbar = k.querySelector(".bar"), kp = pos(k);
      var x2 = kp.x + kbar.offsetLeft, y2 = kp.y + kbar.offsetTop + kbar.offsetHeight / 2;
      var mx = (x1 + x2) / 2;
      var d = "M" + x1 + "," + y1 + " C" + mx + "," + y1 + " " + mx + "," + y2 + " " + x2 + "," + y2;
      var chosen = k.classList.contains("sel") || k.classList.contains("report");
      var color = k.classList.contains("report") ? k.style.getPropertyValue("--c") : ORANGE;
      var key = (parent.dataset.key || "") + ">" + k.dataset.key;
      var isNew = !linkSeen[key];
      nextSeen[key] = 1;
      var delay = idx * 80;

      var path = mk("path", { d: d, class: "lk" + (chosen ? " on" : "") });
      if (chosen) { path.setAttribute("stroke", color); path.style.color = color; }
      svg.appendChild(path);
      var len = path.getTotalLength();
      var grow = animate && isNew && !reduce;
      if (grow) {
        path.animate([{ strokeDasharray: len + " " + len, strokeDashoffset: len }, { strokeDasharray: len + " " + len, strokeDashoffset: 0 }],
          { duration: 760, delay: delay, easing: "cubic-bezier(.4,0,.2,1)", fill: "backwards" });
        /* el nodo nuevo brota desde el nodo elegido */
        k.animate([{ opacity: 0, transform: "translate(" + (x1 - x2) + "px," + (y1 - y2) + "px) scale(.5)" }, { opacity: 1, transform: "none" }],
          { duration: 780, delay: delay, easing: "cubic-bezier(.2,.9,.25,1.08)", fill: "backwards" });
        sendPulse(path, len, delay, 760, k);
      }
      if (chosen && !reduce) svg.appendChild(mk("path", { d: d, class: "flow" }));
      dots.push({ x: x2, y: y2, color: color, chosen: chosen, delay: delay, grow: grow });
      idx++;
    });
    svg.appendChild(mk("circle", { cx: x1, cy: y1, r: 3.5, fill: i === 0 ? BASE : ORANGE }));
    dots.forEach(function (o) {
      var c = mk("circle", { cx: o.x, cy: o.y, r: o.chosen ? 3.5 : 2.8, fill: o.chosen ? o.color : "#05070D", stroke: o.chosen ? "none" : "#DCDCDC", "stroke-opacity": .45, "stroke-width": 1.1 });
      svg.appendChild(c);
      if (o.grow) c.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, delay: o.delay + 520, fill: "backwards" });
    });
  }
  linkSeen = nextSeen;
}

/* ============ EVENTOS ============
   kb detecta navegación con teclado | el "click" global maneja: quitar selección (×), Reiniciar, abrir reportes y elegir área/subproceso */

document.addEventListener("keydown", function () { kb = true; });
document.addEventListener("pointerdown", function () { kb = false; });

document.addEventListener("click", function (e) {
  var clr = e.target.closest("[data-clear]");
  if (clr) {
    var k = clr.dataset.clear;
    if (k === "area") { sel.area = null; sel.proc = null; sel.sub = null; }
    if (k === "proc") { sel.proc = null; sel.sub = null; }
    if (k === "sub") { sel.sub = null; }
    render(k); return;
  }
  if (e.target.closest("#reset")) {
    sel.area = sel.proc = sel.sub = null; render("area"); return;
  }
  var rep = e.target.closest("[data-report]");
  if (rep) {
    var r = getSub().reports[+rep.dataset.report];
    if (!r.url) e.preventDefault();   /* reporte sin enlace: no hace nada */
    return;
  }
  var n = e.target.closest(".node[data-col]");
  if (!n) return;
  var col = n.dataset.col, id = n.dataset.id, next = "proc";
  if (col === "area") { sel.area = id; sel.sub = null; next = "sub"; }
  if (col === "proc") { sel.proc = id; sel.sub = null; next = "sub"; }
  if (col === "sub") { sel.sub = id; next = "report"; }
  render(next);
});

function redraw() { requestAnimationFrame(function () { drawLinks(false); }); }
window.addEventListener("resize", redraw);
if (window.ResizeObserver) new ResizeObserver(redraw).observe(tree);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);

render();

/* ============ ABRIR REPORTES DESDE EL EMBEBIDO DE POWER BI ============
   Si la página está dentro de un marco (Power BI Apps), el clic normal puede cargar Power BI dentro del marco y este lo rechaza.
   Aquí se intenta abrir SIEMPRE fuera del marco: 1) pestaña nueva, 2) ventana superior, 3) aviso con el enlace copiado.
   Fuera del embebido (página abierta directamente) no cambia nada: el enlace funciona normal. */
(function () {
  var embedded = false;
  try { embedded = window.top !== window.self; } catch (e) { embedded = true; }
  if (!embedded) return;

  var toast = document.createElement("div");
  toast.className = "toast"; toast.hidden = true; toast.setAttribute("role", "status");
  document.body.appendChild(toast);
  var tmr;
  function say(html) { toast.innerHTML = html; toast.hidden = false; clearTimeout(tmr); tmr = setTimeout(function () { toast.hidden = true; }, 12000); }

  function copy(url) {
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url); return true; } } catch (e) {}
    try { var t = document.createElement("textarea"); t.value = url; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); var ok = document.execCommand("copy"); document.body.removeChild(t); return ok; } catch (e) {}
    return false;
  }

  function openOutside(url) {
    var w = null;
    try { w = window.open(url, "_blank"); } catch (e) {}
    if (w) { try { w.opener = null; } catch (e) {} return; }
    var ok = copy(url);
    say("<b>No se pudo abrir desde aquí.</b> " + (ok ? "El enlace quedó copiado: péguelo en una pestaña nueva." : "Copie este enlace y ábralo en una pestaña nueva:") +
        (ok ? "" : '<input readonly value="' + url.replace(/"/g, "&quot;") + '">'));
    try { window.top.location.href = url; } catch (e) {}
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a.report[href], a.rcard[href]") : null;
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
    e.preventDefault();
    openOutside(a.href);
  });
})();
</script>

</body></html>
